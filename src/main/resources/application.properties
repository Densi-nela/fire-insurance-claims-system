# Application Name
spring.application.name=demo

# Server Port (Binds to Render's PORT environment variable, defaults to 8080 locally)
server.port=${PORT:8080}

# ===================================================================
# SQLite Database Connection Settings (No Installation Required!)
# ===================================================================
# Specifies the SQLite JDBC driver class
spring.datasource.driver-class-name=org.sqlite.JDBC

# Production-grade Dynamic Environment Variable Injection with Fail-Safe Defaults
# If DB_URL environment variable is provided, it connects there; otherwise, it falls back to local SQLite!
spring.datasource.url=${DB_URL:jdbc:sqlite:ecommerce.db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Secure JWT Token Key (Injected from Environment, with development fallback)
jwt.secret=${JWT_SECRET_KEY:super-secret-insurance-key-998877665544}

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# Automatically validates your table schema matches your Kotlin entity classes exactly
# Note: For SQLite local development, we set this to 'none' to prevent SQLite's dynamic type affinity 
# (reporting INTEGER for 8-byte bigints) from triggering false validation errors.
spring.jpa.hibernate.ddl-auto=none

# ===================================================================
# Flyway Database Migration Configuration
# ===================================================================
# Enable Flyway
spring.flyway.enabled=true
# Allow database clean-ups for tests
spring.flyway.clean-disabled=false
# Standard classpath location for SQL migration scripts
spring.flyway.locations=classpath:db/migration

# Shows the generated SQL in your terminal console
spring.jpa.show-sql=true

# Formats the printed SQL nicely in the console
spring.jpa.properties.hibernate.format_sql=true

# Specifies the SQLite dialect so Hibernate knows how to generate SQLite-specific queries
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# ===================================================================
# Pluggable File Storage Configuration (local or s3)
# ===================================================================
# Default to local disk file storage for development, but customizable via environment
file.storage.type=${FILE_STORAGE_TYPE:local}
aws.s3.bucket=${AWS_S3_BUCKET:my-production-insurance-claims-bucket}

# Dynamic CORS Configuration (comma-separated list of trusted frontend domains)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===================================================================
# Production Monitoring & Health Auditing (Spring Actuator Settings)
# ===================================================================
# Expose health, info, and metrics endpoints to administrators/monitoring systems
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================================
# Production-Grade Structured JSON Logging (Spring Boot Native!)
# ===================================================================
# Defaults to 'false' for clean, human-readable console logging locally,
# but can be switched to 'true' in production for lightning-fast search indexing (e.g. AWS CloudWatch / ELK)
logging.structured.json.enabled=${JSON_LOGGING_ENABLED:false}
