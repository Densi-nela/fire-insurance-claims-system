services:
  fireshield-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fireshield-insurance
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - FILE_STORAGE_TYPE=LOCAL
      - FILE_STORAGE_LOCAL_DIR=/app/uploads
    volumes:
      - app-uploads:/app/uploads
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-uploads:
  app-data:
